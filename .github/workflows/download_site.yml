name: 🐳 Docker + 🌐 Localtunnel 穿透隧道

on:
  workflow_dispatch:  # 手动触发
  # push:
  #   branches: [ main ]  # 如果需要自动触发，取消注释

jobs:
  run-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4
      
      - name: 🔨 配置 Docker 构建环境
        uses: docker/setup-buildx-action@v2
      
      - name: 🚀 启动 ComfyUI Docker 容器
        run: |
          docker run -d \
            --name test-server \
            -p 8080:80 \
            nginx:alpine
          
          # 增加等待时间，让容器有足够时间启动
          echo "⏳ 等待容器启动..."
          for i in {1..30}; do
            if curl -s http://localhost:8188 > /dev/null 2>&1; then
              echo "✅ 容器已就绪！"
              break
            fi
            echo "⌛ 正在等待... ($i/30)"
            sleep 2
          done
      
      - name: 🌍 启动网络穿透隧道
        run: |
          set -e

          SUBDOMAIN="test-${{ github.run_id }}"
          LOG_FILE="$RUNNER_TEMP/localtunnel.log"

          npx localtunnel \
            --port 8080 \
            --subdomain "$SUBDOMAIN" \
            > "$LOG_FILE" 2>&1 &

          LT_PID=$!

          echo "⏳ 等待 Localtunnel 分配公网地址..."

          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[^ ]+' "$LOG_FILE" | head -n 1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            if ! kill -0 "$LT_PID" 2>/dev/null; then
              echo "❌ Localtunnel 进程已退出"
              cat "$LOG_FILE"
              exit 1
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ 没有获取到 Localtunnel URL"
            cat "$LOG_FILE"
            exit 1
          fi

          echo "🔗 公网地址：$TUNNEL_URL"

          # 写入 GitHub Actions 环境变量，后续步骤可以使用
          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          # 写入 GitHub Actions 输出变量
          echo "tunnel_url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

          echo "⏳ 保持隧道运行 55 分钟..."
          sleep 3300

          kill "$LT_PID" || true

