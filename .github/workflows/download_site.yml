name: Test Docker Tunnel (Lightweight)

on:
  workflow_dispatch:

jobs:
  test-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Start lightweight web server
        run: |
          docker run -d \
            --name test-server \
            -p 8080:80 \
            nginx:alpine
          
          sleep 3
          
          # 验证容器已启动
          curl http://localhost:8080 || echo "Server not ready yet"
      
      - name: Install localtunnel
        run: npm install -g localtunnel
      
      - name: Expose via localtunnel
        run: |
          npx localtunnel --port 8080 --subdomain test-comfyui-${{ github.run_id }} &
          LT_PID=$!
          
          # 保持连接活跃 55 分钟
          sleep 3300
          
          kill $LT_PID || true
