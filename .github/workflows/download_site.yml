name: Download Site and Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '🌐 请输入要镜像的目标网站地址'
        required: true
        default: 'https://www.geoglify.com/'

env:
  TARGET_URL: ${{ inputs.target_url }}

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ 安装 Python 依赖与 rclone
        run: |
          python -m pip install --upgrade pip
          pip install requests
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔑 配置 Google Drive (rclone)
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🌐 运行 Python 脚本抓取网站
        run: |
          # 动态将输入的目标 URL 注入 Python 脚本或作为环境变量
          python download_script.py

      - name: 🗜️ 打包压缩下载的网站文件
        run: |
          # 检查目录是否存在且非空
          if [ ! -d "./geoglify_mirror" ]; then
            echo "❌ 未找到下载的目录！"
            exit 1
          fi

          # 打包文件夹并使用 xz 极限压缩
          tar -cf site_backup.tar ./geoglify_mirror
          xz -T0 -9e site_backup.tar

      - name: 📂 上传至 Google Drive
        run: |
          rclone mkdir FEADXUS-Google-Drive:/website_backups || true
          rclone copy site_backup.tar.xz FEADXUS-Google-Drive:/website_backups/

      - name: ✅ 验证上传结果
        run: |
          rclone lsf FEADXUS-Google-Drive:/website_backups/
