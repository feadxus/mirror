name: Docker with Localtunnel

on:
  workflow_dispatch:  # 手动触发
  # push:
  #   branches: [ main ]  # 如果需要自动触发，取消注释

jobs:
  run-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      
      - name: Run Docker container
        run: |
          docker run -d \
            --name comfyui \
            -p 8188:8188 \
            feadxus/comfyui-voxcpm:cpu
          
          # 等待容器启动
          sleep 10
      
      - name: Install Node.js and Localtunnel
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g localtunnel
      
      - name: Start Localtunnel tunnel
        run: |
          npx localtunnel --port 8188 &
          TUNNEL_PID=$!
          
          # 等待穿透链接建立
          sleep 5
          
          # 保持运行 55 分钟（留 5 分钟余量，总时间 1 小时内）
          sleep 3300
          
          # 清理
          kill $TUNNEL_PID || true
