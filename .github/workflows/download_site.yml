name: 定时启动

on:
  schedule:
    - cron: '0 8 1-31/2 * *'
    - cron: '0 9 2-30/2 * *'
  workflow_dispatch:

jobs:
  fetch-bridges:
    runs-on: ubuntu-latest

    env:
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}

    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📜 执行程序
        run: python go.py
